apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-api-ingress
  namespace: application-namespace
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: dashboard-api-service
            port:
              number: 80
  ingressClassName: traefik
