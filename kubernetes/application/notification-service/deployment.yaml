apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-deployment
  labels:
    app: notification-service
    environment: production
  namespace: application-namespace
  annotations:
    checkov.io/skip1: CKV_K8S_43=I will add commits when I apply the aws infrastructure
    checkov.io/skip2: CKV_K8S_14=I will add commits when I apply the aws infrastructure
    checkov.io/skip3: CKV_K8S_35
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 30000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: notification-service-service-account
      containers:
      - name: notification-service
        image: 425959969184.dkr.ecr.us-east-1.amazonaws.com/eks-project1-lab/notification-service:1f1d20d156465ddd7c01cd43d7701c6ba661f957-37816451389-1
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 8084
        envFrom:
        - secretRef:
            name: application-secret
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 250m
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8084
          initialDelaySeconds: 120
          periodSeconds: 3
        readinessProbe:
          tcpSocket:
            port: 8084
          initialDelaySeconds: 40
          periodSeconds: 15
        startupProbe:
          tcpSocket:
            port: 8084
          periodSeconds: 5
          failureThreshold: 60
