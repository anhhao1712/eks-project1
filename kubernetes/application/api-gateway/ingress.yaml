apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: application-namespace
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/api"
        backend:
          service:
            name: api-gateway-service
            port:
              number: 80
      - pathType: Prefix
        path: "/auth"
        backend:
          service:
            name: api-gateway-service
            port:
              number: 80
      - pathType: Prefix
        path: "/healthz"
        backend:
          service:
            name: api-gateway-service
            port:
              number: 80
  ingressClassName: traefik

  

