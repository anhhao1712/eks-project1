apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-to-order-service
  namespace: application-namespace
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: worker
    ports:
    - protocol: TCP
      port: 8081
---
