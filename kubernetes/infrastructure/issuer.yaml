apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: issuer

spec:
  acme:
    server: "https://acme-v02.api.letsencrypt.org/directory"
    email: "REPLACE_WITH_YOUR_ACME_EMAIL"
    privateKeySecretRef:
      name: issuer
    solvers:
    - dns01:
        route53:
          hostedZoneID: REPLACE_WITH_YOUR_HOSTED_ZONE_ID
          region: us-east-1
      selector:
        dnsZones:
        - "ecommerce.example.invalid"
    - http01:
        ingress:
          class: traefik
