apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: default
  source:
    repoURL: https://github.com/anhhao1712/eks-project1.git
    targetRevision: main
    path: kubernetes/infrastructure
    directory:
      recurse: true
      exclude: '{issuer.yaml,volumes-snapshot.yaml,karpenter/**,keda/**,namespaces/argocd-ns.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
