apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argo-cd

spec:
  project: default

  source:
    repoURL: https://github.com/anhhao1712/eks-project1.git
    targetRevision: main
    path: kubernetes/infrastructure
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true