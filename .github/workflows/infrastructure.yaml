name: deploy infrastructure
run-name: Deploy Learner Lab infrastructure by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Terraform stage
        required: true
        type: choice
        default: all
        options: [all, infra, platform, refresh]
permissions:
  contents: read
concurrency:
  group: learner-lab-terraform
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          allowed-account-ids: '425959969184'
      - name: Apply Terraform stages
        env:
          DEPLOY_STAGE: ${{ inputs.stage }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: bash scripts/deploy-lab.sh "$DEPLOY_STAGE"
