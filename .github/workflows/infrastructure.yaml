name: infrastructure pipeline 

run-name: infrastructure Pipeline triggered by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the Terraform plan and create/update AWS resources
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    

    defaults:
      run:
        working-directory: terraform

    steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: configure aws
          uses: aws-actions/configure-aws-credentials@v4

          with:
            role-to-assume: arn:aws:iam::241533156847:role/github-actions-terraform
            aws-region: us-east-1

        - name: Sts GetCallerIdentity
          run: |
              aws sts get-caller-identity


        - name: setup terraform
          uses: hashicorp/setup-terraform@v4
          with: 
            terraform_version: 1.10.0

        - name: terraform-init
          run: terraform init
        
        - name: Check Terraform workspace
          run: terraform workspace show

        - name: terraform-fmt
          run: terraform fmt 

        - name: setup tflint
          uses: terraform-linters/setup-tflint@v4

        - name: run tflint
          run: tflint


        - name: run checkov
          uses: bridgecrewio/checkov-action@master
          with:
            hard_fail_on: CKV_AWS_103,CKV2_AWS_74,CKV2_AWS_12,CKV2_AWS_260,CKV2_AWS_129
            framework: terraform
            

        - name: terraform-validate
          run: terraform validate

        - name: Check live Traefik state when the cluster exists
          run: |
                if aws eks describe-cluster --region us-east-1 --name eks-cluster >/dev/null 2>&1; then
                  aws eks update-kubeconfig --region us-east-1 --name eks-cluster
                  kubectl get svc -n traefik || true
                  helm status traefik -n traefik || true
                else
                  echo "EKS cluster does not exist yet; skipping live Traefik check."
                fi

        - name: Reinitialize Terraform backend
          run: |
                 rm -rf .terraform
                 terraform init -reconfigure

        - name: terraform-plan
          
          env: 
                TF_VAR_aws_key_arn: ${{ secrets.AWS_KEY_ARN }}
                TF_VAR_cloudwatch_key_arn: ${{ secrets.CLOUDWATCH_KEY_ARN }}
                TF_VAR_aws_account_id: 241533156847
                TF_VAR_database_url: ${{ secrets.TF_VAR_DATABASE_URL }}
                
          run: | 
                 terraform plan -out=tfplan -input=false
                
              
    
        - name: change it to readable txt
          run: terraform show -no-color tfplan > readable-plan1.txt

        - name: Upload Terraform Plan
          uses: actions/upload-artifact@v4
          with:
            name: tfplan
            path: ./terraform/tfplan

        - name: Upload Terraform Plan
          uses: actions/upload-artifact@v4
          with:
            name: readable-plan1.txt
            path: ./terraform/readable-plan1.txt

  terraform-deploy:
    runs-on: ubuntu-latest
    needs: terraform-check
    if: ${{ inputs.apply == true }}
    
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: checkout
        uses: actions/checkout@v4
       

      - name: downloading tf plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: downloaded-tfplan
        

      - name: downloading tf plan
        uses: actions/download-artifact@v4
        with:
          name: readable-plan1.txt
          path: downloaded-readable-plan1.txt
  

      - name: configure aws
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::241533156847:role/github-actions-terraform
          aws-region: us-east-1
  

      - name: terraform setup
        uses: hashicorp/setup-terraform@v4
        with: 
            terraform_version: 1.10.0

      - name: terraform-init
        run: terraform init

      - name: terraform apply
        run: |
               terraform apply ../downloaded-tfplan/tfplan 
               


