name: destroy infrastructure
run-name: Destroy Learner Lab project by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      delete_state_bucket:
        description: 'Also permanently delete the current state bucket and its history'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: learner-lab-terraform
  cancel-in-progress: false
jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require main
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != refs/heads/main ]]; then
            echo '::error::Run this workflow on main.'
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          allowed-account-ids: '425959969184'
      - name: Check Learner Lab session
        run: bash scripts/check-lab-actions.sh
      - name: Delete workloads, volumes, platform and AWS infrastructure
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'eks-project1-tfstate-425959969184-us-east-1' }}
          DELETE_STATE_BUCKET: ${{ inputs.delete_state_bucket }}
        run: |
          if [[ "$DELETE_STATE_BUCKET" == true ]]; then
            bash scripts/destroy-lab-all.sh
            echo 'Project deployment and dedicated state bucket deleted. LabRole retained.' >> "$GITHUB_STEP_SUMMARY"
          else
            bash scripts/deploy-lab.sh destroy
            echo 'Project deployment deleted. State bucket and LabRole retained.' >> "$GITHUB_STEP_SUMMARY"
          fi
