name: destroy pipeline

run-name:  Destroy pipeline triggered by ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest

    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: configure Aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::241533156847:role/github-actions-destroy
          aws-region: us-east-1

      - name: setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.0

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: terraform destroy plan
        working-directory: terraform

        env:
                TF_VAR_aws_key_arn: ${{ secrets.AWS_KEY_ARN }}
                TF_VAR_cloudwatch_key_arn: ${{ secrets.CLOUDWATCH_KEY_ARN }}
                TF_VAR_aws_account_id: 241533156847
                TF_VAR_database_url: ${{ secrets.TF_VAR_DATABASE_URL }}
                
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Apply Terraform destroy plan
        working-directory: terraform
        run: terraform apply -auto-approve destroy.tfplan

      - name: Verify Terraform state is empty
        working-directory: terraform
        run: |
             state_list=$(terraform state list)

             if [ -n "$state_list" ]; then
               echo "there are still resources in this terraform state:"
               echo "$state_list"
               exit 1

             fi

              echo "Terraform state is empty."


      
