name: destroy pipeline - paused

run-name: Terraform destroy is paused for Learner Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain-paused-destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain why destroy is unavailable
        run: |
          echo "::error::Terraform destruction is paused. The current EKS infrastructure was created through AWS Console and has not been imported into this Terraform state."
          echo "No AWS authentication or resource deletion was performed." >> "$GITHUB_STEP_SUMMARY"
          exit 1
