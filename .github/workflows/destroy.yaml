name: destroy infrastructure
run-name: Destroy Learner Lab project by ${{ github.actor }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learner-lab-terraform
  cancel-in-progress: false
jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          allowed-account-ids: '425959969184'
      - name: Delete workloads, volumes, platform and AWS infrastructure
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: bash scripts/deploy-lab.sh destroy
