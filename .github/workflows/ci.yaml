name: ci pipeline

run-name: CI triggered by ${{ github.actor }}

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "kubernetes/**"
      - "terraform/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "kubernetes/**"
      - "terraform/**"
      - ".github/workflows/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  application-build:
    name: Check ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service:
          - api-gateway
          - dashboard-api
          - inventory-service
          - notification-service
          - order-service
          - payment-service
          - scheduler
          - shipping-service
          - worker
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Build application
        run: go build ./...

  kubernetes-check:
    name: Check Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Scan Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: kubernetes
          framework: kubernetes
          skip_check: CKV_K8S_43,CKV_K8S_14
          output_format: cli

  terraform-validate:
    name: Validate Terraform configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false
      - name: Initialize infrastructure configuration without an AWS backend
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate infrastructure configuration
        run: terraform -chdir=terraform validate
      - name: Initialize platform configuration without an AWS backend
        run: terraform -chdir=terraform/platform init -backend=false -input=false
      - name: Validate platform configuration
        run: terraform -chdir=terraform/platform validate
