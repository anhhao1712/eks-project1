name: app-cd pipeline

run-name: Build and publish Learner Lab images by ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-cd-learner-lab
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "425959969184"
  ECR_PREFIX: eks-project1-lab
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  check-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on the main branch."
            exit 1
          fi

  checks:
    needs: check-branch
    uses: ./.github/workflows/ci.yaml

  aws-preflight:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate with Learner Lab session credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "425959969184"
      - name: Verify all nine ECR repositories exist
        shell: bash
        run: |
          set -euo pipefail
          services=(api-gateway dashboard-api inventory-service notification-service order-service payment-service scheduler shipping-service worker)
          repositories=()
          for service in "${services[@]}"; do
            repositories+=("${ECR_PREFIX}/${service}")
          done
          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "${repositories[@]}" \
            --query 'repositories[].repositoryName' \
            --output text

  build-images:
    needs: aws-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service:
          - api-gateway
          - dashboard-api
          - inventory-service
          - notification-service
          - order-service
          - payment-service
          - scheduler
          - shipping-service
          - worker
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Authenticate with Learner Lab session credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "425959969184"
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          image="${ECR_REGISTRY}/${ECR_PREFIX}/${SERVICE}:${IMAGE_TAG}"
          docker build \
            --file "services/${SERVICE}/Dockerfile" \
            --tag "$image" \
            "services/${SERVICE}"
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln
      - name: Push verified image
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_URI"
          docker push "$image"
          printf '### %s\n`%s`\n' "$SERVICE" "$image" >> "$GITHUB_STEP_SUMMARY"

  update-manifests:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the exact source version that was built
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify main has not changed during the build
        env:
          BUILT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BUILT_SHA" ]; then
            echo "::error::main changed during the build. Run the workflow again on the new main commit. No manifests were pushed."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Update application image references
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          services = [
              "api-gateway", "dashboard-api", "inventory-service",
              "notification-service", "order-service", "payment-service",
              "scheduler", "shipping-service", "worker",
          ]
          registry = f"{os.environ['AWS_ACCOUNT_ID']}.dkr.ecr.{os.environ['AWS_REGION']}.amazonaws.com"
          prefix = os.environ["ECR_PREFIX"]
          tag = os.environ["IMAGE_TAG"]
          changes = []

          for service in services:
              path = Path("kubernetes/application") / service / "deployment.yaml"
              if not path.is_file():
                  raise SystemExit(f"Missing deployment manifest: {path}")
              documents = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              deployments = [
                  document for document in documents
                  if isinstance(document, dict) and document.get("kind") == "Deployment"
              ]
              if len(deployments) != 1:
                  raise SystemExit(f"Expected one Deployment in {path}; found {len(deployments)}")
              containers = deployments[0]["spec"]["template"]["spec"]["containers"]
              candidates = [
                  container for container in containers
                  if container.get("name") == service
                  or str(container.get("image", "")).rsplit("/", 1)[-1].split("@", 1)[0].split(":", 1)[0] == service
              ]
              if not candidates and len(containers) == 1:
                  candidates = containers
              if len(candidates) != 1:
                  raise SystemExit(f"Could not uniquely identify the application container in {path}")
              candidates[0]["image"] = f"{registry}/{prefix}/{service}:{tag}"
              changes.append((path, documents, candidates[0]["image"]))

          for path, documents, image in changes:
              path.write_text(
                  yaml.safe_dump_all(documents, sort_keys=False, allow_unicode=True),
                  encoding="utf-8",
              )
              print(f"Updated {path}: {image}")
          PY
      - name: Commit and push manifests for Argo CD
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/application
          if git diff --cached --quiet; then
            echo "No manifest changes to publish."
            exit 0
          fi
          git commit -m "Deploy Learner Lab images ${IMAGE_TAG}"
          git push origin HEAD:main
          echo "Updated application manifests on main. Argo CD can now sync this revision." >> "$GITHUB_STEP_SUMMARY"
