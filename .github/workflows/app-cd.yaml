name: app-cd pipeline
# builds and tags docker images to ecr repos and updates manifests image tags and commits and pushs the manifest change

run-name: app-cd pipeline by ${{ github.actor }}

on:
  workflow_run:
    workflows:
      - ci pipeline
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: write


jobs:

  prepare:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_commit.message != 'new commits for updated manifests' }}

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Determine image tag
        id: tag
        run: |
           if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
           SHA="${{ github.sha }}"
           else
           SHA="${{ github.event.workflow_run.head_sha }}"
           fi

           echo "image_tag=${SHA}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build-push-docker-images:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}


    strategy:
        matrix:
          service:
            - api-gateway
            - dashboard-api
            - inventory-service
            - notification-service
            - order-service
            - payment-service
            - scheduler
            - shipping-service
            - worker

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
           role-to-assume: arn:aws:iam::241533156847:role/github-actions-ecr
           aws-region: us-east-1

      - name: login to amazon ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image

        run: |
              docker build \
               -t 241533156847.dkr.ecr.us-east-1.amazonaws.com/${{ matrix.service }}:${{ needs.prepare.outputs.image_tag }} \
               ./services/${{ matrix.service }}


      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '241533156847.dkr.ecr.us-east-1.amazonaws.com/${{ matrix.service }}:${{ needs.prepare.outputs.image_tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'




      - name: push docker image
        run: |
              docker push \
              241533156847.dkr.ecr.us-east-1.amazonaws.com/${{ matrix.service }}:${{ needs.prepare.outputs.image_tag }} \

  update-manifests:
    needs:
      - prepare
      - build-push-docker-images
    runs-on: ubuntu-latest

    outputs:
      manifest_commit_sha: ${{ steps.manifest_commit.outputs.commit_sha }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}

    steps:

    - name: checkout
      uses: actions/checkout@v4
      with:
        ref: main


    - name: Update the image tag in the relevant Kubernetes Deployment manifest.
      uses: Charlyzzz/update-k8s-image@v1.7.1
      with:
        manifest-path: kubernetes/application/api-gateway/deployment.yaml
        new-image-tag: ${{ needs.prepare.outputs.image_tag }}
        container-name: api-gateway

    - name: Update the image tag in the relevant Kubernetes Deployment manifest.
      uses: Charlyzzz/update-k8s-image@v1.7.1
      with:
        manifest-path: kubernetes/application/dashboard-api/deployment.yaml
        new-image-tag: ${{ needs.prepare.outputs.image_tag }}
        container-name: dashboard-api

    - name: Check manifest change
      run: |
             grep "image:" kubernetes/application/inventory-service/deployment.yaml
             git diff

    - name: Update the image tag in the relevant Kubernetes Deployment manifest.
      uses: Charlyzzz/update-k8s-image@v1.7.1
      with:
        manifest-path: kubernetes/application/inventory-service/deployment.yaml
        new-image-tag: ${{ needs.prepare.outputs.image_tag }}
        container-name: inventory-service

    - name: Update the image tag in the relevant Kubernetes Deployment manifest.
      uses: Charlyzzz/update-k8s-image@v1.7.1
      with:
        manifest-path: kubernetes/application/notification-service/deployment.yaml
        new-image-tag: ${{ needs.prepare.outputs.image_tag }}
        container-name: notification-service

    - name: Update the image tag in the relevant Kubernetes Deployment manifest.
      uses: Charlyzzz/update-k8s-image@v1.7.1
      with:
        manifest-path: kubernetes/application/order-service/deployment.yaml
        new-image-tag: ${{ needs.prepare.outputs.image_tag }}
        container-name: order-service

    - name: Update the image tag in the relevant Kubernetes Deployment manifest.
      uses: Charlyzzz/update-k8s-image@v1.7.1
      with:
        manifest-path: kubernetes/application/payment-service/deployment.yaml
        new-image-tag: ${{ needs.prepare.outputs.image_tag }}
        container-name: payment-service


    - name: Update the image tag in the relevant Kubernetes Deployment manifest.
      uses: Charlyzzz/update-k8s-image@v1.7.1
      with:
        manifest-path: kubernetes/application/scheduler/deployment.yaml
        new-image-tag: ${{ needs.prepare.outputs.image_tag }}
        container-name: scheduler

    - name: Update the image tag in the relevant Kubernetes Deployment manifest.
      uses: Charlyzzz/update-k8s-image@v1.7.1
      with:
        manifest-path: kubernetes/application/shipping-service/deployment.yaml
        new-image-tag: ${{ needs.prepare.outputs.image_tag }}
        container-name: shipping-service

    - name: Update the image tag in the relevant Kubernetes Deployment manifest.
      uses: Charlyzzz/update-k8s-image@v1.7.1
      with:
        manifest-path: kubernetes/application/worker/deployment.yaml
        new-image-tag: ${{ needs.prepare.outputs.image_tag }}
        container-name: worker

    - name: setting up gitHub then creating git commit and pushing it to gitHub
      id: manifest_commit
      run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add kubernetes/
          git commit -m "new commits for updated manifests"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push

  Rollback-Steps:
    needs: update-manifests
    runs-on: ubuntu-latest

    steps:

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::241533156847:role/github-actions-eks-deploy
        aws-region: us-east-1

    - name: Configure kubectl
      run: |
         aws eks update-kubeconfig \
         --region us-east-1 \
         --name eks-cluster

    - name: Wait for Argo CD sync and verify rollout
      id: rollout
      continue-on-error: true
      env:
        IMAGE_TAG: ${{ needs.update-manifests.outputs.image_tag }}
      run: |
            set -euo pipefail

            services=(
              "api-gateway:api-gateway-deployment"
              "dashboard-api:dashboard-api-deployment"
              "inventory-service:inventory-service-deployment"
              "notification-service:notification-service-deployment"
              "order-service:order-service-deployment"
              "payment-service:payment-service-deployment"
              "scheduler:scheduler-deployment"
              "shipping-service:shipping-service-deployment"
              "worker:worker-deployment"
            )

            echo "Waiting for Argo CD to apply image tag ${IMAGE_TAG}..."
            synced=false
            for attempt in $(seq 1 60); do
              synced=true
              for item in "${services[@]}"; do
                service="${item%%:*}"
                deployment="${item#*:}"
                expected="241533156847.dkr.ecr.us-east-1.amazonaws.com/${service}:${IMAGE_TAG}"
                actual="$(kubectl get deployment "${deployment}" -n application-namespace -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
                if [[ "${actual}" != "${expected}" ]]; then
                  synced=false
                  break
                fi
              done

              if [[ "${synced}" == "true" ]]; then
                break
              fi

              echo "Argo CD has not applied all images yet (attempt ${attempt}/60)."
              sleep 10
            done

            if [[ "${synced}" != "true" ]]; then
              echo "Timed out waiting for Argo CD to apply the new image tag."
              exit 1
            fi

            for item in "${services[@]}"; do
              deployment="${item#*:}"
              kubectl rollout status "deployment/${deployment}" -n application-namespace --timeout=5m
            done

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Configure Git
      if: steps.rollout.outcome == 'failure'
      run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

    - name: Rollback failed deployment
      if: steps.rollout.outcome == 'failure'
      run: |
            git revert --no-edit ${{ needs.update-manifests.outputs.manifest_commit_sha }}
            git push origin main

    - name: Mark workflow failed when rollout fails
      if: steps.rollout.outcome == 'failure'
      run: exit 1
